<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Login - Board Game Explorer</title>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/tokens.css" />

    <script type="module">
        import { define, Auth } from "@calpoly/mustang";
        import { LoginFormElement } from "/src/auth/login-form.ts";

        define({
            "mu-auth": Auth.Provider,
            "login-form": LoginFormElement
        });
    </script>

    <style>
        body {
            background: var(--color-background-page);
            font-family: var(--font-family-base);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-family: var(--font-family-display);
            color: var(--color-accent);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 4px solid var(--color-accent);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .brand p {
            color: var(--color-text-muted);
            margin-top: 0.5rem;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm), 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
        }

        h2 {
            color: var(--color-accent);
            font-family: var(--font-family-display);
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }

        label {
            display: block;
            margin-bottom: 1.25rem;
        }

        label span {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-text);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--color-border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: var(--font-family-base);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(47, 62, 59, 0.1);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover:not(:disabled) {
            background: var(--color-accent-strong);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--color-text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-text);
        }

        .footer-link a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 1rem;
            border: 1px solid #ef5350;
        }
    </style>
</head>
<body>
<mu-auth>
    <div class="login-container">
        <div class="brand">
            <h1>Board Game Explorer</h1>
            <p>Discover your next favorite game</p>
        </div>

        <main class="card">
            <h2>Welcome Back</h2>
            <login-form api="/auth/login">
                <label>
                    <span>Username</span>
                    <input name="username" autocomplete="username" placeholder="Enter your username" />
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" />
                </label>
            </login-form>

            <p class="footer-link">
                Don't have an account?
                <a href="/register.html">Create one</a>
            </p>
        </main>
    </div>
</mu-auth>
</body>
</html>
