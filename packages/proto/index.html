<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Board Game Explorer</title>

    <link rel="modulepreload" href="/src/bgx-card.ts">
    <link rel="modulepreload" href="/src/bgx-dashboard.ts">

    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <script type="module" src="/scripts/darkmode.js" defer></script>

    <script type="module">
        import { define, Auth } from "@calpoly/mustang";
        import { BgxCard } from "/src/bgx-card.ts";
        import { BgxDashboard } from "/src/bgx-dashboard.ts";
        import { BgxHeader } from "/src/bgx-header.ts";

        define({
            "bgx-card": BgxCard,
            "bgx-dashboard": BgxDashboard,
            "bgx-header": BgxHeader,
            "mu-auth": Auth.Provider
        });
    </script>

</head>

<body>
<mu-auth provides="bgx:auth">
    <bgx-header></bgx-header>

    <main>
        <bgx-dashboard src="/api/cards"></bgx-dashboard>
    </main>
</mu-auth>
</body>
</html>
